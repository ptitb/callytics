[global]
type = global
endpoint_identifier_order = username,ip,anonymous

; transport-udp and transport-tcp are generated from SIP_PORT in .env at container start
#tryinclude pjsip_transports.conf

; transport-tls is generated when SIP_TLS_* in .env point to a certificate
#tryinclude pjsip_tls.conf

#tryinclude pjsip_webrtc.conf

[test-phone-auth]
type = auth
auth_type = userpass
username = test-phone
password = test1234

[test-phone]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

[test-phone]
type = endpoint
context = callytics-inbound
disallow = all
allow = opus
allow = ulaw
allow = alaw
aors = test-phone
auth = test-phone-auth
direct_media = no
force_rport = yes
rewrite_contact = yes

[callytics-endpoint-template](!)
type = endpoint
context = callytics-inbound
disallow = all
allow = opus
allow = ulaw
allow = alaw
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes

#tryinclude pjsip_callytics_extensions.conf
#tryinclude pjsip_callytics_trunks.conf
